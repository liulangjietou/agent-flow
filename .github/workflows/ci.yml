name: Build and verify

on:
  push:
  pull_request:

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentflow_schema_test
          POSTGRES_USER: agentflow_test
          POSTGRES_PASSWORD: isolated-ci-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentflow_test -d agentflow_schema_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AGENTFLOW_SCHEMA_TEST_URL: jdbc:postgresql://localhost:5432/agentflow_schema_test
      AGENTFLOW_SCHEMA_TEST_USERNAME: agentflow_test
      AGENTFLOW_SCHEMA_TEST_PASSWORD: isolated-ci-database-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify offline migrations and production startup on PostgreSQL
        run: mvn -B -ntp -pl agentflow-server -am -Dtest=DatabaseSchemaPostgresIT -Dsurefire.failIfNoSpecifiedTests=false test

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check Java author tags
        run: java scripts/CheckAuthors.java .
      - name: Verify backend
        run: mvn -B -ntp verify
      - name: Verify maintenance and capacity tool guards
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /fyoung/tmp
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate production Compose configuration
        run: |
          docker compose --env-file deploy/production/production.env.example -f compose.production.yml config --quiet
          docker compose --env-file deploy/production/production.env.example -f compose.production.yml -f compose.monitoring.yml config --quiet
      - name: Verify monitoring configuration and alert behavior
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/rules:ro" -w /rules prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 check config --syntax-only prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/rules:ro" -w /rules prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 check rules alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/rules:ro" -w /rules prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 test rules alerts.test.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agentflow-web/package-lock.json
      - name: Verify frontend
        working-directory: agentflow-web
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /fyoung/tmp
          npm ci
          npm run test:requests
          npm run build
