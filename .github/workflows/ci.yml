name: Build and verify

on:
  push:
  pull_request:

env:
  # 测试与脚本的临时根目录；本地未设置时回退到系统临时目录。
  AGENTFLOW_TMP_DIR: /fyoung/tmp

jobs:
  dependency-review:
    # 只在 PR 上比对新增依赖的已知漏洞，高危及以上阻断合并。
    # 该 Action 依赖仓库开启 Dependency graph（Settings → Code security）；开启后把仓库变量
    # DEPENDENCY_REVIEW_ENABLED 设为 true 才运行，未开启时跳过而非固定失败。npm audit 与 Dependabot 不受影响。
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          POSTGRES_DB: agentflow_schema_test
          POSTGRES_USER: agentflow_test
          POSTGRES_PASSWORD: isolated-ci-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentflow_test -d agentflow_schema_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AGENTFLOW_SCHEMA_TEST_URL: jdbc:postgresql://localhost:5432/agentflow_schema_test
      AGENTFLOW_SCHEMA_TEST_USERNAME: agentflow_test
      AGENTFLOW_SCHEMA_TEST_PASSWORD: isolated-ci-database-only
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated test artifacts
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /fyoung/tmp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify offline migrations and production startup on PostgreSQL
        run: mvn -B -ntp -pl agentflow-server -am -Dtest=DatabaseSchemaPostgresIT -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify shared sessions and concurrent workflow operations on PostgreSQL
        env:
          AGENTFLOW_SESSION_TEST_URL: jdbc:postgresql://localhost:5432/agentflow_schema_test
          AGENTFLOW_SESSION_TEST_DRIVER: org.postgresql.Driver
          AGENTFLOW_SESSION_TEST_USERNAME: agentflow_test
          AGENTFLOW_SESSION_TEST_PASSWORD: isolated-ci-database-only
        run: mvn -B -ntp -pl agentflow-server -am -Dtest=SharedSessionIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify MyBatis XML mappings and transaction boundaries on PostgreSQL
        env:
          AGENTFLOW_MYBATIS_TEST_URL: jdbc:postgresql://localhost:5432/agentflow_schema_test
          AGENTFLOW_MYBATIS_TEST_USERNAME: agentflow_test
          AGENTFLOW_MYBATIS_TEST_PASSWORD: isolated-ci-database-only
        run: mvn -B -ntp -pl agentflow-server -am -Dtest=MyBatisMappingContractTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify organization, field access and financial receipt boundaries on PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PG_TEST_DATABASE_PREFIX: agentflow_business
          AGENTFLOW_PG_TEST_BASE_URL: jdbc:postgresql://localhost:5432/
          PGPASSWORD: isolated-ci-database-only
          # 每个上下文独立持有连接池，及时淘汰旧上下文，保留单池原有并发容量。
          JAVA_TOOL_OPTIONS: -Dspring.test.context.cache.maxSize=4 -Djava.io.tmpdir=/fyoung/tmp
        run: |
          postgres_cases=(
            'AGENTFLOW_ORGANIZATION_TEST:organization'
            'AGENTFLOW_ORGANIZATION_MIGRATION:organization_migration'
            'AGENTFLOW_CONTEXT_MIGRATION:context_migration'
            'AGENTFLOW_FIELD_TEST:field_permissions'
            'AGENTFLOW_QUEUE_TEST:pending_queue'
            'AGENTFLOW_OPERATIONS_TEST:operations'
            'AGENTFLOW_ROUND_ORGANIZATION_MIGRATION:round_organization'
            'AGENTFLOW_ATTACHMENT_TEST:attachments'
            'AGENTFLOW_ATTACHMENT_MIGRATION:attachment_migration'
            'AGENTFLOW_COPY_TEST:copies'
            'AGENTFLOW_COPY_MIGRATION:copy_migration'
            'AGENTFLOW_EXECUTION_TEST:assist_execution'
            'AGENTFLOW_EXECUTION_MIGRATION:assist_migration'
            'AGENTFLOW_EXPLANATION_TEST:precheck_explanation'
            'AGENTFLOW_CORRECTION_MIGRATION:expense_correction_migration'
            'AGENTFLOW_HANDLING_MIGRATION:expense_handling_migration'
            'AGENTFLOW_ORCHESTRATION_MIGRATION:expense_orchestration_migration'
            'AGENTFLOW_REPAYMENT_TEST:advance_repayments'
            'AGENTFLOW_DISBURSEMENT_RETURN_MIGRATION:disbursement_return_migration'
            'AGENTFLOW_ADVANCE_VOUCHER_MIGRATION:advance_voucher_migration'
            'AGENTFLOW_VOUCHER_REVERSAL_MIGRATION:voucher_reversal_migration'
            'AGENTFLOW_REVERSAL_EXECUTION_MIGRATION:reversal_execution_migration'
            'AGENTFLOW_REVERSAL_RETIREMENT_MIGRATION:reversal_retirement_migration'
            'AGENTFLOW_COUNTERSIGN_POLICY:countersign_policy'
            'AGENTFLOW_TIMER_WAIT:timer_wait'
            'AGENTFLOW_INSTANCE_CONTROL:instance_control'
            'AGENTFLOW_EVENT_WAIT:event_wait'
            'AGENTFLOW_EVENT_INBOX:event_inbox'
            'AGENTFLOW_EVENT_INBOX_MIGRATION:event_inbox_migration'
            'AGENTFLOW_EVENT_CONTRACT:event_contract'
            'AGENTFLOW_EVENT_CONTRACT_MIGRATION:event_contract_migration'
          )
          for test_case in "${postgres_cases[@]}"; do
            IFS=: read -r test_config_prefix test_database_suffix <<< "$test_case"
            test_database="${PG_TEST_DATABASE_PREFIX}_${test_database_suffix}"
            docker exec -e PGPASSWORD "$PG_CONTAINER" createdb -h 127.0.0.1 -U "$AGENTFLOW_SCHEMA_TEST_USERNAME" "$test_database"
            export "${test_config_prefix}_URL=${AGENTFLOW_PG_TEST_BASE_URL}${test_database}"
            export "${test_config_prefix}_USER=${AGENTFLOW_SCHEMA_TEST_USERNAME}"
            export "${test_config_prefix}_PASSWORD=${AGENTFLOW_SCHEMA_TEST_PASSWORD}"
            export "${test_config_prefix}_DRIVER=org.postgresql.Driver"
          done
          mvn -B -ntp -pl agentflow-server -am -Dtest=OrganizationApprovalIntegrationTest,OrganizationMigrationTest,FieldPermissionsIntegrationTest,PendingTaskQueueIntegrationTest,ApprovalOperationsIntegrationTest,RoundOrganizationSearchMigrationTest,AttachmentIntegrationTest,AttachmentMigrationTest,ApplicationCopyIntegrationTest,CopyMigrationTest,AssistExecutionIntegrationTest,AssistExecutionMigrationTest,PrecheckExplanationIntegrationTest,ExpenseCorrectionMigrationTest,ExpenseHandlingMigrationTest,AdvanceRepaymentIntegrationTest,DisbursementReturnMigrationTest,AdvanceVoucherReviewMigrationTest,VoucherReversalMigrationTest,VoucherReversalExecutionMigrationTest,VoucherReversalRetirementMigrationTest,CountersignPolicyIntegrationTest,TimerWaitIntegrationTest,InstanceControlIntegrationTest,EventWaitIntegrationTest,EventInboxIntegrationTest,EventInboxMigrationTest,EventContractIntegrationTest,EventContractMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test
          for test_case in "${postgres_cases[@]}"; do
            IFS=: read -r test_config_prefix test_database_suffix <<< "$test_case"
            test_database="${PG_TEST_DATABASE_PREFIX}_${test_database_suffix}"
            actual_version=$(docker exec -e PGPASSWORD "$PG_CONTAINER" psql -h 127.0.0.1 -U "$AGENTFLOW_SCHEMA_TEST_USERNAME" -d "$test_database" -Atc 'SELECT max(version::integer) FROM flyway_schema_history')
            test "$actual_version" -gt 0
            printf '%s: schema V%s verified\n' "$test_database_suffix" "$actual_version"
          done

  verify:
    runs-on: ubuntu-latest
    # 正常全量约半小时；堆泄漏会让 GC 抖动拖到默认 6 小时上限，超时即失败以便尽早暴露。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated test artifacts
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /fyoung/tmp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check Java author tags
        run: java scripts/CheckAuthors.java .
      - name: Verify backend
        env:
          # 与 PostgreSQL 矩阵和本地验证使用相同的上下文缓存上限，及时释放旧连接池。
          JAVA_TOOL_OPTIONS: -Dspring.test.context.cache.maxSize=4 -Djava.io.tmpdir=/fyoung/tmp
        run: mvn -B -ntp verify
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: agentflow-server/target/site/jacoco
          if-no-files-found: ignore
      - name: Verify maintenance and capacity tool guards
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /fyoung/tmp
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate production Compose configuration
        run: |
          docker compose --env-file deploy/production/production.env.example -f compose.production.yml config --quiet
          docker compose --env-file deploy/production/production.env.example -f compose.production.yml -f compose.attachments.yml config --quiet
          docker compose --env-file deploy/production/production.env.example -f compose.production.yml -f compose.assist.yml config --quiet
          docker compose --env-file deploy/production/production.env.example -f compose.production.yml -f compose.monitoring.yml config --quiet
      - name: Verify monitoring configuration and alert behavior
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/rules:ro" -w /rules prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 check config --syntax-only prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/rules:ro" -w /rules prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 check rules alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/rules:ro" -w /rules prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 test rules alerts.test.yml
      - name: Verify proxy failover and one-time authorization callback handling
        run: python3 scripts/verify_cluster_proxy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agentflow-web/package-lock.json
      - name: Verify frontend
        working-directory: agentflow-web
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /fyoung/tmp
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run test:requests
          npm run build
