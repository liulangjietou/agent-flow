name: agentflow-demo

services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow-local-demo-only
    volumes:
      - demo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      SERVER_ADDRESS: 0.0.0.0
      AGENTFLOW_DATASOURCE_URL: jdbc:postgresql://database:5432/agentflow?connectTimeout=3&socketTimeout=10
      AGENTFLOW_DATASOURCE_USERNAME: agentflow
      AGENTFLOW_DATASOURCE_PASSWORD: agentflow-local-demo-only
      AGENTFLOW_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 3000
      AGENTFLOW_DEMO_AUTH: "true"
      AGENTFLOW_WEB_ORIGIN: http://127.0.0.1:${AGENTFLOW_DEMO_PORT:-8180}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:${AGENTFLOW_DEMO_PORT:-8180}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=4", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  demo-postgres:
