spring:
  application:
    name: agentflow-server
  datasource:
    url: ${AGENTFLOW_DATASOURCE_URL:jdbc:h2:file:./data/agentflow;DB_CLOSE_ON_EXIT=FALSE}
    username: ${AGENTFLOW_DATASOURCE_USERNAME:sa}
    password: ${AGENTFLOW_DATASOURCE_PASSWORD:}
    driver-class-name: ${AGENTFLOW_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

flowable:
  database-schema-update: true
  check-process-definitions: true
  async-executor-activate: false
  process-definition-location-prefix: classpath:/processes/

agentflow:
  monitoring:
    enabled: ${AGENTFLOW_METRICS_ENABLED:false}
    token-file: ${AGENTFLOW_METRICS_TOKEN_FILE:}
  auth:
    demo-enabled: ${AGENTFLOW_DEMO_AUTH:true}
    session:
      jdbc-enabled: ${AGENTFLOW_JDBC_SESSIONS:false}
    backchannel:
      enabled: ${AGENTFLOW_OIDC_BACKCHANNEL_LOGOUT:false}
  web:
    allowed-origin: ${AGENTFLOW_WEB_ORIGIN:http://localhost:5173}

management:
  prometheus:
    metrics:
      export:
        enabled: ${agentflow.monitoring.enabled}
  metrics:
    distribution:
      slo:
        http.server.requests: 500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
