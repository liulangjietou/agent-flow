spring:
  application:
    name: agentflow-server
  datasource:
    url: ${AGENTFLOW_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentflow}
    username: ${AGENTFLOW_DATASOURCE_USERNAME:root}
    password: ${AGENTFLOW_DATASOURCE_PASSWORD:123456}
    driver-class-name: ${AGENTFLOW_DATASOURCE_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

flowable:
  database-schema-update: true
  check-process-definitions: true
  async-executor-activate: false
  process-definition-location-prefix: classpath:/processes/

agentflow:
  notifications:
    proxy-reminders-enabled: ${AGENTFLOW_PROXY_REMINDERS_ENABLED:true}
    delivery-worker-enabled: ${AGENTFLOW_NOTIFICATION_DELIVERY_WORKER_ENABLED:false}
    public-url: ${AGENTFLOW_NOTIFICATION_PUBLIC_URL:}
    smtp-servers: {}
    bindings: {}
  events:
    enabled: ${AGENTFLOW_EVENTS_ENABLED:false}
    worker-enabled: ${AGENTFLOW_EVENTS_WORKER_ENABLED:true}
    sources: {}
  budgets:
    worker-enabled: ${AGENTFLOW_BUDGET_WORKER_ENABLED:true}
    lease-seconds: ${AGENTFLOW_BUDGET_LEASE_SECONDS:90}
  advances:
    overdue:
      reminders-enabled: ${AGENTFLOW_ADVANCE_OVERDUE_REMINDERS_ENABLED:true}
      reminder-delay-ms: ${AGENTFLOW_ADVANCE_OVERDUE_REMINDER_DELAY_MS:60000}
      # 按租户显式设置 tenants.<tenant>.block-new-requests；缺省不自动阻断。
      tenants: {}
  expenses:
    precheck-worker-enabled: ${AGENTFLOW_EXPENSE_PRECHECK_WORKER_ENABLED:true}
    precheck-timeout-seconds: ${AGENTFLOW_EXPENSE_PRECHECK_TIMEOUT_SECONDS:300}
  invoices:
    extraction-worker-enabled: ${AGENTFLOW_INVOICE_EXTRACTION_WORKER_ENABLED:true}
    verification-worker-enabled: ${AGENTFLOW_INVOICE_VERIFICATION_WORKER_ENABLED:true}
    max-wallet-bytes: ${AGENTFLOW_INVOICE_MAX_WALLET_BYTES:1073741824}
    max-wallet-uploads: ${AGENTFLOW_INVOICE_MAX_WALLET_UPLOADS:1000}
  finance-gateway:
    enabled: ${AGENTFLOW_FINANCE_GATEWAY_ENABLED:false}
    tenants: {}
  payment-callbacks:
    enabled: ${AGENTFLOW_PAYMENT_CALLBACKS_ENABLED:false}
    worker-enabled: ${AGENTFLOW_PAYMENT_CALLBACKS_WORKER_ENABLED:true}
    tenants: {}
  assist:
    enabled: ${AGENTFLOW_ASSIST_ENABLED:false}
    worker-enabled: ${AGENTFLOW_ASSIST_WORKER_ENABLED:true}
    endpoint: ${AGENTFLOW_ASSIST_ENDPOINT:}
    provider-id: ${AGENTFLOW_ASSIST_PROVIDER:openai-compatible}
    model: ${AGENTFLOW_ASSIST_MODEL:}
    api-key: ${AGENTFLOW_ASSIST_API_KEY:}
    timeout-seconds: ${AGENTFLOW_ASSIST_TIMEOUT_SECONDS:45}
  attachments:
    directory: ${AGENTFLOW_ATTACHMENT_DIRECTORY:}
    max-file-bytes: ${AGENTFLOW_ATTACHMENT_MAX_FILE_BYTES:20971520}
    max-application-bytes: ${AGENTFLOW_ATTACHMENT_MAX_APPLICATION_BYTES:268435456}
    max-application-uploads: ${AGENTFLOW_ATTACHMENT_MAX_APPLICATION_UPLOADS:100}
  monitoring:
    enabled: ${AGENTFLOW_METRICS_ENABLED:false}
    expected-instances: ${AGENTFLOW_EXPECTED_INSTANCES:1}
    token-file: ${AGENTFLOW_METRICS_TOKEN_FILE:}
  auth:
    demo-enabled: ${AGENTFLOW_DEMO_AUTH:true}
    session:
      jdbc-enabled: ${AGENTFLOW_JDBC_SESSIONS:false}
    backchannel:
      enabled: ${AGENTFLOW_OIDC_BACKCHANNEL_LOGOUT:false}
  web:
    allowed-origin: ${AGENTFLOW_WEB_ORIGIN:http://localhost:5173}

management:
  prometheus:
    metrics:
      export:
        enabled: ${agentflow.monitoring.enabled}
  metrics:
    distribution:
      slo:
        http.server.requests: 500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
