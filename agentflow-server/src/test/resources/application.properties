# 测试使用独立内存库；注解、动态属性和显式环境变量仍可指定 PostgreSQL 测试库。
spring.datasource.url=${AGENTFLOW_DATASOURCE_URL:jdbc:h2:mem:agentflow-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AGENTFLOW_DATASOURCE_USERNAME:sa}
spring.datasource.password=${AGENTFLOW_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${AGENTFLOW_DATASOURCE_DRIVER:org.h2.Driver}
