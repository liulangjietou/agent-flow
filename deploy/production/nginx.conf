# 访问日志不记录查询参数、Cookie、Authorization、Referer 或请求体。
log_format agentflow_production '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent $request_time';

server {
    listen 127.0.0.1:8080;
    access_log off;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout agentflow_production;
    # 每次请求使用解析结果的独立地址列表，避免 DNS 缩容改变进行中请求的重试机会。
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://server:8080;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 6s;

    # 身份回调错误也可能携带授权码；其错误详情由后端受控日志排查，保留无参数的状态日志。
    location ^~ /api/v1/auth/oidc/ {
        error_log /dev/null;
        # 授权回调虽是 GET，但会消费一次性授权码；响应丢失时不能向另一实例重放。
        proxy_next_upstream off;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /actuator/health/readiness {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location /actuator/ { return 404; }
    location /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
}
