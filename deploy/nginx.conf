server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://server:8080;

    # 大正文仅开放给附件内容接口；数据库登记摘要仍按普通 JSON 限制。
    location ~ "^/api/v1/applications/[0-9a-fA-F-]{36}/attachments/[0-9a-fA-F-]{36}/content$" {
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    # 个人票夹原件同样流式转发，单份上限为 20 MiB。
    location ~ "^/api/v1/invoices/[0-9a-fA-F-]{36}/content$" {
        client_max_body_size 20m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /actuator/health/readiness {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /actuator/ { return 404; }
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
}
