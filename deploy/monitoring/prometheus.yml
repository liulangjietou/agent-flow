global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agentflow
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    dns_sd_configs:
      - names: [server]
        type: A
        port: 8080
        refresh_interval: 5s

